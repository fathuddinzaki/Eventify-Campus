# 📐 Dokumen Diagram UML — Eventify Campus

> **Proyek:** Eventify Campus — Aplikasi Manajemen Event Kampus  
> **Teknologi:** Flutter + Firebase (Firestore & Auth) + Local Notifications  
> **Mahasiswa:** Yudistyo Herlambang — NIM 24312120 — Prodi Informatika

---

## 1. Use Case Diagram

Use Case Diagram menggambarkan interaksi antara aktor **Mahasiswa** dengan seluruh fitur pada sistem Eventify Campus, termasuk interaksi sistem notifikasi otomatis.

```mermaid
flowchart LR
    subgraph Sistem Eventify Campus
        UC1["🔐 Login"]
        UC2["📝 Registrasi Akun"]
        UC3["📊 Melihat Dashboard & Statistik"]
        UC4["📋 Melihat Daftar Event"]
        UC5["🔍 Mencari Event"]
        UC6["🏷️ Memfilter Event Berdasarkan Kategori"]
        UC7["➕ Menambahkan Event Baru"]
        UC8["✏️ Mengedit Event"]
        UC9["🗑️ Menghapus Event"]
        UC10["📄 Melihat Detail Event"]
        UC11["👤 Melihat Profil"]
        UC12["🔔 Mengelola Pengaturan Notifikasi"]
        UC13["🚪 Logout"]
        
        %% System specific
        UC14["⏰ Mengirim Notifikasi Real-time & Pengingat"]
    end

    Mahasiswa(("👨‍🎓 Mahasiswa"))
    Sistem(("⚙️ Sistem (Background)"))

    Mahasiswa --> UC1
    Mahasiswa --> UC2
    Mahasiswa --> UC3
    Mahasiswa --> UC4
    Mahasiswa --> UC5
    Mahasiswa --> UC6
    Mahasiswa --> UC7
    Mahasiswa --> UC8
    Mahasiswa --> UC9
    Mahasiswa --> UC10
    Mahasiswa --> UC11
    Mahasiswa --> UC12
    Mahasiswa --> UC13
    
    Sistem --> UC14

    UC1 -. "«include»" .-> UC3
    UC2 -. "«include»" .-> UC3
    UC4 -. "«extend»" .-> UC5
    UC4 -. "«extend»" .-> UC6
    UC10 -. "«extend»" .-> UC8
    
    UC7 -. "«trigger»" .-> UC14
    UC8 -. "«trigger»" .-> UC14
    UC9 -. "«trigger»" .-> UC14
```

### Deskripsi Use Case

| No | Use Case | Deskripsi |
|----|----------|-----------|
| UC1 | Login | Mahasiswa masuk ke sistem menggunakan email dan password via Firebase Auth |
| UC2 | Registrasi Akun | Mahasiswa membuat akun baru dengan profil lengkap yang disimpan ke Firestore |
| UC3 | Melihat Dashboard | Melihat ringkasan statistik (total event, aktif, selesai) |
| UC4-6 | Melihat/Cari/Filter | Mahasiswa mencari atau memfilter event dari database Cloud Firestore |
| UC7-9 | CRUD Event | Membuat, mengedit, atau menghapus event |
| UC10 | Melihat Detail Event | Melihat informasi lengkap suatu event |
| UC11 | Melihat Profil | Menampilkan data profil (nama, NIM, jurusan) |
| UC12 | Mengelola Notifikasi | Mahasiswa dapat menyalakan/mematikan notifikasi (alarm & pengingat) |
| UC13 | Logout | Keluar dari akun |
| UC14 | Mengirim Notifikasi | Sistem secara otomatis mengirim notifikasi ketika event dibuat/diupdate/dihapus, serta pengingat H-1 dan H-1 jam acara. |

## 5. Class Diagram

```mermaid
classDiagram
    class UserModel {
        +String uid
        +String name
        +String email
        +String nim
        +String major
        +toMap() Map~String, dynamic~
        +fromMap(Map, String) UserModel
    }

    class EventModel {
        +String id
        +String name
        +String pic
        +DateTime date
        +String location
        +String description
        +String status
        +String category
        +DateTime createdAt
        +toMap() Map~String, dynamic~
        +fromFirestore(Map, String) EventModel
    }

    class AuthService {
        -FirebaseAuth _firebaseAuth
        -FirebaseFirestore _firestore
        +firebaseUserStream Stream~User~
        +login(email, password) Future~UserModel~
        +register(name, email, password, nim, major) Future~UserModel~
        +getCurrentUser() Future~UserModel?~
        +logout() Future~void~
    }

    class EventService {
        -FirebaseFirestore _firestore
        +getEventsStream() Stream~List~EventModel~~
        +getEventsOnce() Future~List~EventModel~~
        +addEvent(EventModel) Future~void~
        +updateEvent(EventModel) Future~void~
        +deleteEvent(String) Future~void~
    }

    class NotificationService {
        -FlutterLocalNotificationsPlugin _plugin
        -bool _isInitialized
        +initialize() Future~void~
        +showEventCreatedNotification(EventModel) Future~void~
        +showEventUpdatedNotification(EventModel) Future~void~
        +showEventDeletedNotification(String) Future~void~
        +scheduleEventReminder(EventModel) Future~void~
        +scheduleEventReminderHourBefore(EventModel) Future~void~
        +cancelEventReminders(String) Future~void~
        +cancelAll() Future~void~
    }

    class DatabaseHelper {
        -String _userKey$
        -String _notifKey$
        +saveLocalUser(Map)$ Future~void~
        +getLocalUser()$ Future~Map?~
        +clearLocalUser()$ Future~void~
        +isNotificationEnabled()$ Future~bool~
        +setNotificationEnabled(bool)$ Future~void~
    }

    class AppState {
        -AuthService _authService
        -EventService _eventService
        -NotificationService _notificationService
        -bool _notificationsEnabled
        -UserModel? _currentUser
        -List~EventModel~ _events
        +toggleNotifications(bool) Future~void~
        +login(String, String) Future~void~
        +register(...) Future~void~
        +logout() Future~void~
        +addEvent(...) Future~void~
        +updateEvent(...) Future~void~
        +deleteEvent(String) Future~void~
        +loadEventsData() Future~void~
    }

    AppState --> AuthService : uses
    AppState --> EventService : uses
    AppState --> NotificationService : uses
    AppState --> UserModel : manages
    AppState --> EventModel : manages
    AuthService --> UserModel : creates
    AuthService --> DatabaseHelper : uses
    EventService --> EventModel : uses
```

## 6. Sequence Diagram — Login

```mermaid
sequenceDiagram
    actor M as 👨‍🎓 Mahasiswa
    participant LS as LoginScreen
    participant AS as AppState
    participant Auth as AuthService
    participant DB as DatabaseHelper
    participant FB as Firebase

    M->>LS: Input email & password
    M->>LS: Tap "Masuk Ke Aplikasi"
    LS->>AS: login(email, password)
    AS->>Auth: login(email, password)
    Auth->>FB: signInWithEmailAndPassword()
    FB-->>Auth: UserCredential
    Auth->>FB: Fetch profil dari Firestore
    FB-->>Auth: User document
    Auth->>DB: saveLocalUser(userMap)
    Auth-->>AS: UserModel
    AS->>AS: loadEventsData() (Subscribe to Stream)
    AS-->>LS: Notifikasi state berubah
    LS-->>M: Tampilkan snackbar sukses
    LS->>LS: Navigator ke Dashboard
```

## 7. Sequence Diagram — Tambah Event & Notifikasi

```mermaid
sequenceDiagram
    actor M as 👨‍🎓 Mahasiswa
    participant AES as AddEditEventScreen
    participant AS as AppState
    participant ES as EventService
    participant FS as Cloud Firestore
    participant NS as NotificationService

    M->>AES: Isi form event lengkap
    M->>AES: Tap "Publikasikan Event"
    AES->>AS: addEvent(name, date, ...)
    AS->>AS: Buat EventModel baru (Generate ID)
    AS->>ES: addEvent(eventModel)
    ES->>FS: collection('events').doc(id).set(event)
    FS-->>ES: Success
    ES-->>AS: Complete
    
    alt Notifications Enabled
        AS->>NS: showEventCreatedNotification(eventModel)
        NS-->>M: Push Notification "Event Baru Ditambahkan"
        alt Status == 'Aktif'
            AS->>NS: scheduleEventReminder(eventModel)
            NS->>NS: Set OS Alarm untuk H-1
            AS->>NS: scheduleEventReminderHourBefore(eventModel)
            NS->>NS: Set OS Alarm untuk 1 Jam sebelum
        end
    end

    AS-->>AES: Complete
    AES-->>M: Snackbar "Event berhasil ditambahkan!"
    AES->>AES: Redirect ke Daftar Event
```

## 8. Sequence Diagram — Hapus Event

```mermaid
sequenceDiagram
    actor M as 👨‍🎓 Mahasiswa
    participant HT as HomeTab / EventsTab
    participant AS as AppState
    participant ES as EventService
    participant FS as Cloud Firestore
    participant NS as NotificationService

    M->>HT: Tap Konfirmasi Hapus
    HT->>AS: deleteEvent(eventId)
    AS->>AS: Get eventName dari local list
    AS->>ES: deleteEvent(id)
    ES->>FS: collection('events').doc(id).delete()
    FS-->>ES: Success
    ES-->>AS: Complete
    
    alt Notifications Enabled
        AS->>NS: showEventDeletedNotification(eventName)
        NS-->>M: Push Notification "Event Dihapus"
        AS->>NS: cancelEventReminders(eventId)
        NS->>NS: Batalkan OS Alarm untuk event ini
    end

    AS-->>HT: Update UI
```
